name: Dependabot auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Read Dependabot metadata and verify commits
    if: >-
      github.repository == 'tech-grandpa/codex-sub-proxy' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      package_maintainer_changes: ${{ steps.metadata.outputs.maintainer-changes }}
      trusted_commits: ${{ steps.commits.outputs.trusted }}
      update_type: ${{ steps.metadata.outputs.update-type }}

    steps:
      # This read-only job intentionally does not check out or execute pull-request code.
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `maintainer-changes` reports package publisher changes, not extra PR commits.
      # Verify every commit independently so a human-modified Dependabot branch fails closed.
      - name: Verify every pull request commit
        id: commits
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          trusted=true
          count=0
          while IFS=$'\t' read -r author committer verified reason; do
            count=$((count + 1))
            if [[ "$author" != 'dependabot[bot]' ||
                  "$committer" != 'web-flow' ||
                  "$verified" != 'true' ||
                  "$reason" != 'valid' ]]; then
              trusted=false
            fi
          done < <(
            gh api --paginate \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
              --jq '.[] | [(.author.login // ""), (.committer.login // ""), (.commit.verification.verified | tostring), (.commit.verification.reason // "")] | @tsv'
          )

          if [[ "$count" -eq 0 ]]; then
            trusted=false
          fi

          echo "Verified $count pull request commit(s); trusted=$trusted"
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  enable-auto-merge:
    name: Enable auto-merge for trusted non-major updates
    needs: metadata
    if: >-
      github.actor == 'dependabot[bot]' &&
      needs.metadata.outputs.package_maintainer_changes == 'false' &&
      needs.metadata.outputs.trusted_commits == 'true' &&
      (needs.metadata.outputs.update_type == 'version-update:semver-patch' ||
      needs.metadata.outputs.update_type == 'version-update:semver-minor')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Enable native auto-merge while required checks are pending. GitHub then performs
      # the merge only after the protected main branch's required checks succeed.
      - name: Enable squash auto-merge for the current head commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

  disable-auto-merge:
    name: Disable auto-merge for trust-sensitive changes
    needs: metadata
    if: >-
      always() &&
      needs.metadata.result != 'skipped' &&
      (needs.metadata.result != 'success' ||
      needs.metadata.outputs.package_maintainer_changes == 'true' ||
      needs.metadata.outputs.trusted_commits != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Disable existing auto-merge request
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          current_head_sha="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
          if [[ "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "Pull request head changed; leaving the newer auto-merge state untouched."
            exit 0
          fi
          gh pr merge --disable-auto "$PR_URL"

  report-major-update:
    name: Leave major updates for manual review
    needs: metadata
    if: needs.metadata.outputs.update_type == 'version-update:semver-major'
    runs-on: ubuntu-latest

    steps:
      - run: echo "Major dependency update detected; manual review is required."
