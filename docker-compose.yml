services:
  codex-sub-proxy:
    image: ghcr.io/tech-grandpa/codex-sub-proxy:latest
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      OPENAI_TOKEN_FILE: ${OPENAI_TOKEN_FILE:-/var/lib/codex-sub-proxy/tokens.json}
    volumes:
      - codex-token-data:/var/lib/codex-sub-proxy
    restart: unless-stopped

volumes:
  codex-token-data:
